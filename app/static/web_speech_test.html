<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Speech STT Test</title>
  <style>
    body { max-width: 760px; margin: 48px auto; padding: 0 20px; font-family: system-ui, sans-serif; color: #172033; }
    textarea { box-sizing: border-box; width: 100%; min-height: 180px; padding: 16px; font-size: 17px; }
    button { margin: 14px 8px 14px 0; padding: 10px 18px; cursor: pointer; }
    #status { color: #526079; }
    #analysisResult { margin-top: 24px; padding: 16px; border: 1px solid #d7deea; border-radius: 8px; }
    #analysisResult dt { margin-top: 10px; font-weight: 700; }
    #analysisResult dd { margin: 4px 0 0; }
    #chatResult { margin-top: 24px; padding: 16px; border: 1px solid #d7deea; border-radius: 8px; }
    #chatResult dt { margin-top: 10px; font-weight: 700; }
    #chatResult dd { margin: 4px 0 0; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>Web Speech STT</h1>
    <p>브라우저의 Web Speech API로 한국어 음성을 텍스트로 변환합니다.</p>
    <textarea id="transcript" placeholder="마이크 버튼을 누르고 한국어로 말하세요."></textarea>
    <div>
      <button id="startButton" type="button">마이크 시작</button>
      <button id="stopButton" type="button" disabled>중지</button>
      <button id="clearButton" type="button">초기화</button>
    </div>
    <p id="status">브라우저 지원 여부를 확인하고 있습니다.</p>
    <p>STT 처리 시간: <strong id="sttTime">-</strong></p>
    <section id="analysisResult" aria-labelledby="analysisHeading">
      <h2 id="analysisHeading">Gemini 감정 분석</h2>
      <p id="analysisStatus" aria-live="polite">음성 인식이 끝나면 자동으로 분석합니다.</p>
      <dl>
        <dt>감정</dt>
        <dd id="emotion">-</dd>
        <dt>추론 말투</dt>
        <dd id="inferredStyle">-</dd>
        <dt>의도</dt>
        <dd id="intent">-</dd>
        <dt>Gemini 처리 시간</dt>
        <dd id="analysisTime">-</dd>
      </dl>
    </section>
    <section id="chatResult" aria-labelledby="chatHeading">
      <h2 id="chatHeading">Gemini 채팅 생성</h2>
      <p id="chatStatus" aria-live="polite">감정 분석이 끝나면 자동으로 답변을 생성합니다.</p>
      <dl>
        <dt>채팅 답변</dt>
        <dd id="chatAnswer">-</dd>
        <dt>답변 말투</dt>
        <dd id="responseStyle">-</dd>
      </dl>
    </section>
  </main>
  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const transcriptElement = document.querySelector('#transcript');
    const startButton = document.querySelector('#startButton');
    const stopButton = document.querySelector('#stopButton');
    const statusElement = document.querySelector('#status');
    const analysisStatusElement = document.querySelector('#analysisStatus');
    const emotionElement = document.querySelector('#emotion');
    const inferredStyleElement = document.querySelector('#inferredStyle');
    const intentElement = document.querySelector('#intent');
    const analysisTimeElement = document.querySelector('#analysisTime');
    const chatStatusElement = document.querySelector('#chatStatus');
    const chatAnswerElement = document.querySelector('#chatAnswer');
    const responseStyleElement = document.querySelector('#responseStyle');
    let recognition = null;
    let startedAt = null;
    let finalTranscript = '';
    let recognitionFailed = false;
    let keepListening = false;
    let analysisController = null;

    function clearAnalysis() {
      emotionElement.textContent = '-';
      inferredStyleElement.textContent = '-';
      intentElement.textContent = '-';
      analysisTimeElement.textContent = '-';
      chatAnswerElement.textContent = '-';
      responseStyleElement.textContent = '-';
      chatStatusElement.textContent = '감정 분석이 끝나면 자동으로 답변을 생성합니다.';
    }

    async function generateChatResponse(text, analysis) {
      chatStatusElement.textContent = 'Gemini가 채팅 답변을 생성하고 있습니다.';
      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          persona: 'doyun',
          question: text,
          analysis: {
            emotion: analysis.user_emotion,
            inferred_style: analysis.inferred_style,
            intent: analysis.user_intent,
          },
        }),
        signal: analysisController.signal,
      });
      const contentType = response.headers.get('content-type') || '';
      const body = contentType.includes('application/json')
        ? await response.json()
        : { detail: await response.text() };
      if (!response.ok) {
        const detail = body.detail || '채팅 답변 생성에 실패했습니다.';
        throw new Error(`HTTP ${response.status}: ${detail}`);
      }
      chatAnswerElement.textContent = body.answer;
      responseStyleElement.textContent = body.response_style || '-';
      chatStatusElement.textContent = '채팅 답변 생성이 완료됐습니다.';
    }

    async function analyzeEmotion(text) {
      analysisController?.abort();
      analysisController = new AbortController();
      clearAnalysis();
      analysisStatusElement.textContent = 'Gemini가 감정을 분석하고 있습니다.';

      try {
        const response = await fetch('/api/v1/user-input/text', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
          signal: analysisController.signal,
        });
        const contentType = response.headers.get('content-type') || '';
        const body = contentType.includes('application/json')
          ? await response.json()
          : { detail: await response.text() };
        if (!response.ok) {
          const detail = body.detail || '감정 분석 요청에 실패했습니다.';
          throw new Error(`HTTP ${response.status}: ${detail}`);
        }

        emotionElement.textContent = body.user_emotion;
        inferredStyleElement.textContent = body.inferred_style || '-';
        intentElement.textContent = body.user_intent;
        analysisTimeElement.textContent = body.processing_time_ms == null
          ? '-'
          : `${body.processing_time_ms} ms`;
        analysisStatusElement.textContent = '감정 분석이 완료됐습니다.';
        await generateChatResponse(text, body);
      } catch (error) {
        if (error.name === 'AbortError') return;
        const message = error instanceof TypeError
          ? '감정 분석 서버에 연결하지 못했습니다. Uvicorn 실행 상태와 현재 접속 주소를 확인하세요.'
          : error.message;
        if (analysisStatusElement.textContent === '감정 분석이 완료됐습니다.') {
          chatStatusElement.textContent = `채팅 생성 오류: ${message}`;
        } else {
          analysisStatusElement.textContent = `감정 분석 오류: ${message}`;
        }
      }
    }

    function setListening(isListening) {
      startButton.disabled = isListening || !SpeechRecognition;
      stopButton.disabled = !isListening;
    }

    function createRecognition() {
      const instance = new SpeechRecognition();
      instance.lang = 'ko-KR';
      instance.interimResults = true;
      instance.continuous = true;
      instance.onstart = () => {
        recognitionFailed = false;
        setListening(true);
        statusElement.textContent = '듣고 있습니다. 말을 다 한 뒤 중지를 누르세요.';
      };
      instance.onresult = (event) => {
        let interimTranscript = '';
        for (let index = event.resultIndex; index < event.results.length; index += 1) {
          const text = event.results[index][0].transcript;
          if (event.results[index].isFinal) finalTranscript += `${text} `;
          else interimTranscript += text;
        }
        transcriptElement.value = `${finalTranscript}${interimTranscript}`.trim();
      };
      instance.onerror = (event) => {
        if (event.error === 'no-speech' && keepListening) {
          statusElement.textContent = '음성을 기다리고 있습니다. 계속 말해주세요.';
          return;
        }
        recognitionFailed = true;
        keepListening = false;
        statusElement.textContent = `음성 인식 오류: ${event.error}`;
      };
      instance.onend = async () => {
        if (keepListening && !recognitionFailed) {
          statusElement.textContent = '음성 인식을 계속합니다.';
          recognition = createRecognition();
          recognition.start();
          return;
        }

        setListening(false);
        if (startedAt !== null) {
          document.querySelector('#sttTime').textContent = `${(performance.now() - startedAt).toFixed(0)} ms`;
        }
        if (recognitionFailed) return;

        const transcript = transcriptElement.value.trim();
        statusElement.textContent = transcript
          ? '텍스트 변환이 완료되었습니다.'
          : '인식된 텍스트가 없습니다.';
        if (!transcript) {
          analysisStatusElement.textContent = '분석할 텍스트가 없습니다.';
          return;
        }
        await analyzeEmotion(transcript);
      };
      return instance;
    }

    startButton.addEventListener('click', () => {
      analysisController?.abort();
      transcriptElement.value = '';
      finalTranscript = '';
      document.querySelector('#sttTime').textContent = '-';
      clearAnalysis();
      analysisStatusElement.textContent = '음성 인식이 끝나면 자동으로 분석합니다.';
      startedAt = performance.now();
      keepListening = true;
      recognitionFailed = false;
      recognition = createRecognition();
      recognition.start();
    });
    stopButton.addEventListener('click', () => {
      keepListening = false;
      statusElement.textContent = '음성 인식을 마무리하고 있습니다.';
      recognition?.stop();
    });
    document.querySelector('#clearButton').addEventListener('click', () => {
      analysisController?.abort();
      keepListening = false;
      transcriptElement.value = '';
      finalTranscript = '';
      document.querySelector('#sttTime').textContent = '-';
      clearAnalysis();
      analysisStatusElement.textContent = '음성 인식이 끝나면 자동으로 분석합니다.';
    });

    if (SpeechRecognition) statusElement.textContent = '마이크 버튼을 눌러 테스트하세요.';
    else {
      startButton.disabled = true;
      statusElement.textContent = '이 브라우저는 Web Speech API를 지원하지 않습니다. Chrome 또는 Edge를 사용하세요.';
    }
  </script>
</body>
</html>
