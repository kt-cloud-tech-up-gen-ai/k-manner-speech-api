<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Speech 전체 음성 파이프라인 테스트</title>
  <style>
    body { max-width: 820px; margin: 48px auto; padding: 0 20px; font-family: system-ui, sans-serif; color: #172033; }
    textarea { box-sizing: border-box; width: 100%; min-height: 160px; padding: 16px; font-size: 17px; }
    input { box-sizing: border-box; width: 100%; margin: 6px 0 14px; padding: 10px 12px; font-size: 16px; }
    button { margin: 14px 8px 14px 0; padding: 10px 18px; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.55; }
    #status, #pipelineStatus { color: #526079; }
    section { margin-top: 24px; padding: 16px; border: 1px solid #d7deea; border-radius: 8px; }
    dt { margin-top: 10px; font-weight: 700; }
    dd { margin: 4px 0 0; white-space: pre-wrap; }
    audio { width: 100%; margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Web Speech 전체 음성 파이프라인</h1>
    <p>마이크 음성 또는 직접 입력한 텍스트로 감정분석, 페르소나 답변, Gemini TTS까지 실행합니다.</p>

    <label for="roomId">Room ID</label>
    <input id="roomId" type="text" autocomplete="off" placeholder="대화할 room_id">
    <label for="accessToken">로그인 Access Token</label>
    <input id="accessToken" type="password" autocomplete="off" placeholder="Bearer 토큰">

    <label for="transcript">STT 변환 텍스트</label>
    <textarea id="transcript" placeholder="마이크 시작을 누르고 한국어로 말하세요."></textarea>
    <div>
      <button id="startButton" type="button">마이크 시작</button>
      <button id="stopButton" type="button" disabled>중지 후 전체 실행</button>
      <button id="textPipelineButton" type="button">입력한 텍스트로 전체 실행</button>
      <button id="clearButton" type="button">초기화</button>
    </div>
    <p id="status" aria-live="polite">브라우저 지원 여부를 확인하고 있습니다.</p>
    <p>STT 처리 시간: <strong id="sttTime">-</strong></p>

    <section aria-labelledby="pipelineHeading">
      <h2 id="pipelineHeading">전체 처리 상태</h2>
      <p id="pipelineStatus" aria-live="polite">음성 인식이 끝나면 전체 파이프라인을 실행합니다.</p>
      <p>전체 Gemini 처리 시간: <strong id="pipelineTime">-</strong></p>
    </section>

    <section id="analysisResult" aria-labelledby="analysisHeading">
      <h2 id="analysisHeading">Gemini 감정 분석</h2>
      <dl>
        <dt>감정</dt>
        <dd id="emotion">-</dd>
        <dt>추론 말투</dt>
        <dd id="inferredStyle">-</dd>
        <dt>의도</dt>
        <dd id="intent">-</dd>
      </dl>
    </section>

    <section id="chatResult" aria-labelledby="chatHeading">
      <h2 id="chatHeading">Gemini 페르소나 답변</h2>
      <dl>
        <dt>채팅 답변</dt>
        <dd id="chatAnswer">-</dd>
        <dt>답변 말투</dt>
        <dd id="responseStyle">-</dd>
      </dl>
    </section>

    <section id="ttsResult" aria-labelledby="ttsHeading">
      <h2 id="ttsHeading">Gemini TTS 음성</h2>
      <p id="audioInfo">생성된 음성이 없습니다.</p>
      <audio id="ttsAudio" controls preload="none">이 브라우저는 오디오 재생을 지원하지 않습니다.</audio>
    </section>

    <section id="feedbackResult" aria-labelledby="feedbackHeading">
      <h2 id="feedbackHeading">사용자 발화 피드백</h2>
      <p>점수: <strong id="feedbackScore">-</strong></p>
      <p id="feedbackSummary">-</p>
    </section>
  </main>
  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const transcriptElement = document.querySelector('#transcript');
    const roomIdElement = document.querySelector('#roomId');
    const accessTokenElement = document.querySelector('#accessToken');
    const startButton = document.querySelector('#startButton');
    const stopButton = document.querySelector('#stopButton');
    const textPipelineButton = document.querySelector('#textPipelineButton');
    const statusElement = document.querySelector('#status');
    const pipelineStatusElement = document.querySelector('#pipelineStatus');
    const pipelineTimeElement = document.querySelector('#pipelineTime');
    const emotionElement = document.querySelector('#emotion');
    const inferredStyleElement = document.querySelector('#inferredStyle');
    const intentElement = document.querySelector('#intent');
    const chatAnswerElement = document.querySelector('#chatAnswer');
    const responseStyleElement = document.querySelector('#responseStyle');
    const audioElement = document.querySelector('#ttsAudio');
    const audioInfoElement = document.querySelector('#audioInfo');
    const feedbackScoreElement = document.querySelector('#feedbackScore');
    const feedbackSummaryElement = document.querySelector('#feedbackSummary');
    let recognition = null;
    let startedAt = null;
    let finalTranscript = '';
    let recognitionFailed = false;
    let keepListening = false;
    let pipelineController = null;
    let audioObjectUrl = null;

    function clearPipelineResult() {
      emotionElement.textContent = '-';
      inferredStyleElement.textContent = '-';
      intentElement.textContent = '-';
      chatAnswerElement.textContent = '-';
      responseStyleElement.textContent = '-';
      pipelineTimeElement.textContent = '-';
      audioInfoElement.textContent = '생성된 음성이 없습니다.';
      feedbackScoreElement.textContent = '-';
      feedbackSummaryElement.textContent = '-';
      audioElement.pause();
      if (audioObjectUrl) URL.revokeObjectURL(audioObjectUrl);
      audioObjectUrl = null;
      audioElement.removeAttribute('src');
      audioElement.load();
    }

    async function runInputPipeline(text, inputType) {
      pipelineController?.abort();
      pipelineController = new AbortController();
      clearPipelineResult();
      pipelineStatusElement.textContent = '감정분석, 답변 생성, 음성 합성을 순서대로 실행하고 있습니다.';
      startButton.disabled = true;
      const isVoice = inputType === 'voice';

      try {
        const roomId = roomIdElement.value.trim();
        const accessToken = accessTokenElement.value.trim();
        if (!roomId || !accessToken) {
          throw new Error('Room ID와 로그인 Access Token을 입력하세요.');
        }
        const endpoint = isVoice
          ? `/rooms/${encodeURIComponent(roomId)}/turns/voice`
          : `/rooms/${encodeURIComponent(roomId)}/turns/text`;
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${accessToken}`,
          },
          body: isVoice
            ? JSON.stringify({ transcript: text })
            : JSON.stringify({ text }),
          signal: pipelineController.signal,
        });
        const contentType = response.headers.get('content-type') || '';
        const body = contentType.includes('application/json')
          ? await response.json()
          : { detail: await response.text() };
        if (!response.ok) {
          const detail = body.detail || '전체 음성 파이프라인 실행에 실패했습니다.';
          throw new Error(`HTTP ${response.status}: ${detail}`);
        }

        const conversation = body.conversation;
        emotionElement.textContent = conversation.analysis.user_emotion;
        inferredStyleElement.textContent = conversation.analysis.inferred_style || '-';
        intentElement.textContent = conversation.analysis.user_intent;
        chatAnswerElement.textContent = conversation.answer;
        responseStyleElement.textContent = conversation.response_style;
        pipelineTimeElement.textContent = `${conversation.processing_time_ms} ms`;
        feedbackScoreElement.textContent = `${body.feedback.score}점`;
        feedbackSummaryElement.textContent = body.feedback.summary;

        const audioFilename = conversation.audio.audio_path.split('/').pop();
        if (!audioFilename) throw new Error('생성된 WAV 파일명을 확인할 수 없습니다.');
        const audioResponse = await fetch(
          `/rooms/${encodeURIComponent(roomId)}/audio/${encodeURIComponent(audioFilename)}`,
          { headers: { Authorization: `Bearer ${accessToken}` } },
        );
        if (!audioResponse.ok) throw new Error('생성된 WAV 파일을 불러오지 못했습니다.');
        audioObjectUrl = URL.createObjectURL(await audioResponse.blob());
        audioElement.src = audioObjectUrl;
        audioElement.load();
        audioInfoElement.textContent = `${conversation.audio.voice_name} · ${conversation.audio.tts_model}`;
        pipelineStatusElement.textContent = '전체 파이프라인 실행이 완료됐습니다. 아래에서 음성을 재생하세요.';
      } catch (error) {
        if (error.name === 'AbortError') return;
        clearPipelineResult();
        const message = error instanceof TypeError
          ? '통합 파이프라인 서버에 연결하지 못했습니다. Uvicorn 실행 상태와 현재 접속 주소를 확인하세요.'
          : error.message;
        pipelineStatusElement.textContent = `전체 파이프라인 오류: ${message}`;
      } finally {
        startButton.disabled = !SpeechRecognition;
      }
    }

    async function runVoiceInput(text) {
      await runInputPipeline(text, 'voice');
    }

    async function runTextInput(text) {
      await runInputPipeline(text, 'text');
    }

    function setListening(isListening) {
      startButton.disabled = isListening || !SpeechRecognition;
      stopButton.disabled = !isListening;
    }

    function createRecognition() {
      const instance = new SpeechRecognition();
      instance.lang = 'ko-KR';
      instance.interimResults = true;
      instance.continuous = true;
      instance.onstart = () => {
        recognitionFailed = false;
        setListening(true);
        statusElement.textContent = '듣고 있습니다. 말을 다 한 뒤 중지를 누르세요.';
      };
      instance.onresult = (event) => {
        let interimTranscript = '';
        for (let index = event.resultIndex; index < event.results.length; index += 1) {
          const text = event.results[index][0].transcript;
          if (event.results[index].isFinal) finalTranscript += `${text} `;
          else interimTranscript += text;
        }
        transcriptElement.value = `${finalTranscript}${interimTranscript}`.trim();
      };
      instance.onerror = (event) => {
        if (event.error === 'no-speech' && keepListening) {
          statusElement.textContent = '음성을 기다리고 있습니다. 계속 말해주세요.';
          return;
        }
        recognitionFailed = true;
        keepListening = false;
        statusElement.textContent = `음성 인식 오류: ${event.error}`;
      };
      instance.onend = async () => {
        if (keepListening && !recognitionFailed) {
          statusElement.textContent = '음성 인식을 계속합니다.';
          recognition = createRecognition();
          recognition.start();
          return;
        }

        setListening(false);
        if (startedAt !== null) {
          document.querySelector('#sttTime').textContent = `${(performance.now() - startedAt).toFixed(0)} ms`;
        }
        if (recognitionFailed) return;

        const transcript = transcriptElement.value.trim();
        statusElement.textContent = transcript
          ? '텍스트 변환이 완료되었습니다.'
          : '인식된 텍스트가 없습니다.';
        if (!transcript) {
          pipelineStatusElement.textContent = '처리할 텍스트가 없습니다.';
          return;
        }
        await runVoiceInput(transcript);
      };
      return instance;
    }

    startButton.addEventListener('click', () => {
      pipelineController?.abort();
      transcriptElement.value = '';
      finalTranscript = '';
      document.querySelector('#sttTime').textContent = '-';
      clearPipelineResult();
      pipelineStatusElement.textContent = '음성 인식이 끝나면 전체 파이프라인을 실행합니다.';
      startedAt = performance.now();
      keepListening = true;
      recognitionFailed = false;
      recognition = createRecognition();
      recognition.start();
    });
    stopButton.addEventListener('click', () => {
      keepListening = false;
      statusElement.textContent = '음성 인식을 마무리하고 있습니다.';
      recognition?.stop();
    });
    textPipelineButton.addEventListener('click', async () => {
      const text = transcriptElement.value.trim();
      if (!text) {
        pipelineStatusElement.textContent = '직접 입력한 텍스트가 없습니다.';
        return;
      }
      await runTextInput(text);
    });
    document.querySelector('#clearButton').addEventListener('click', () => {
      pipelineController?.abort();
      keepListening = false;
      recognition?.stop();
      transcriptElement.value = '';
      finalTranscript = '';
      document.querySelector('#sttTime').textContent = '-';
      clearPipelineResult();
      pipelineStatusElement.textContent = '음성 인식이 끝나면 전체 파이프라인을 실행합니다.';
    });

    if (SpeechRecognition) statusElement.textContent = '마이크 시작을 눌러 테스트하세요.';
    else {
      startButton.disabled = true;
      statusElement.textContent = '이 브라우저는 Web Speech API를 지원하지 않습니다. Chrome 또는 Edge를 사용하세요.';
    }
  </script>
</body>
</html>
